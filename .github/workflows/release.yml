name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      pages: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run tests
        run: pnpm run test

      # CALCULATE BUNDLE GZIP SIZE
      - name: Calculate Bundle Size
        id: bundle_size
        run: |
          # Zoek automatisch het juiste minified of hoofdbestand op
          FILE=$(ls packages/core/dist/index.min.js packages/core/dist/index.js 2>/dev/null | head -n 1)

          if [ -f "$FILE" ]; then
            BYTES=$(gzip -c "$FILE" | wc -c | tr -d ' ')
            KB=$(node -e "console.log(($BYTES / 1024).toFixed(1))")
            echo "GZIP_KB=${KB} kB" >> $GITHUB_ENV
            echo "Found file $FILE: ${KB} kB"
          else
            echo "GZIP_KB=unknown" >> $GITHUB_ENV
            echo "ERROR: Dist file not found!"
          fi

      # PR OR PUBLISH
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release:ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # TAGGING FALLBACK
      - name: Manual Tagging Fallback
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          VERSION=$(node -p "require('./packages/core/package.json').version")
          TAG="@nullix/zod-mongoose@$VERSION"

          echo "Checking if tag $TAG exists on remote..."

          if ! git ls-remote --tags origin | grep -q "refs/tags/$TAG"; then
            echo "Tag does not exist on remote. Creating tag..."
            git tag "$TAG"
            git push origin "$TAG"
          else
            echo "Tag already exists on remote. Skipping push to avoid error."
          fi

      # DOCS & ARTIFACTS
      - name: Build docs
        run: pnpm --filter docs run build

      - name: Prepare docs artifact & inject badge JSON
        run: |
          mkdir -p docs-build
          cp -r packages/docs/.output/* docs-build/

          # Write dynamic Shields.io JSON endpoint into docs root
          echo "{\"schemaVersion\":1,\"label\":\"gzipped size\",\"message\":\"${{ env.GZIP_KB }}\",\"color\":\"41b883\"}" > docs-build/size-badge.json

      - name: Upload Docs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation-site
          path: docs-build/
          retention-days: 7

      # GITHUB PAGES DEPLOY
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-build/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
