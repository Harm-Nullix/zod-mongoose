name: Feature Request
description: Suggest an idea or improvement for this project
title: "[FEAT]: "
labels: ["enhancement"]
body:
  - type: checkboxes
    id: target-packages
    attributes:
      label: Target Packages
      description: Which package should receive this feature?
      options:
        - label: core
        - label: docs
        - label: studio
        - label: playground
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category / Area
      options:
        - Zod
        - Mongoose
        - Parsing
        - Validation
        - Typing
    validations:
      required: true

  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: What is the proposed feature or improvement?
      render: markdown
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use Case & Motivation
      description: Why is this feature needed? What problem does it solve?
      render: markdown

  - type: textarea
    id: environment
    attributes:
      label: Environment & Stack (Optional)
      description: |
        Provide details about your stack. You can run this command in your terminal to copy your clean environment data directly to your clipboard, then paste it below:

        **macOS:**
        `node -e 'const p=require("./package.json"),d={...p.dependencies,...p.devDependencies};console.log(JSON.stringify({node:process.version,os:process.platform,packages:{zod:d.zod,mongoose:d.mongoose,typescript:d.typescript}},null,2))' | pbcopy`

        **Windows (PowerShell) / Linux (xclip):**
        `node -e 'const p=require("./package.json"),d={...p.dependencies,...p.devDependencies};console.log(JSON.stringify({node:process.version,os:process.platform,packages:{zod:d.zod,mongoose:d.mongoose,typescript:d.typescript}},null,2))' | clip`
      placeholder: |
        ```json
        {
          "node": "v24.0.0",
          "os": "darwin",
          "packages": {
            "zod": "4.4.3",
            "mongoose": "9.7.4",
            "typescript": "5.9.3"
          }
        }
        ```
      render: markdown
