version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    rebase-strategy: "auto"
    schedule:
      interval: weekly
    groups:
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/packages/docs"
    rebase-strategy: "auto"
    schedule:
      interval: weekly
    groups:
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
